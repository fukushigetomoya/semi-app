<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
    <title>Semi-app</title>
  </head>
  <body>
    <div id="goalSettingPage" class="screen active">
      <h1>目標設定</h1>
      <form id="goalForm">
        <label for="goal">目標:</label>
        <input type="text" id="goal" name="goal" required autofocus />
        <button type="submit">設定</button>
      </form>
    </div>

    <div id="timerPage" class="screen">
      <h1>タイマーを作る</h1>
      <form onsubmit="startTimer(); return false;">
        <label for="timer-input">分数を入力：</label>
        <input
          type="number"
          id="timer-input"
          value="30"
          min="1"
          max="120"
          placeholder="30"
          autofocus
        />
        <button type="submit" id="timer-button">スタート</button>
      </form>
      <div id="timer">00:00</div>
    </div>

    <div id="reviewPage" class="screen active">
      <h1>評価画面</h1>
      <form id="reviewForm">
        <fieldset>
          <legend>満足度を選択してください</legend>
          <input
            type="radio"
            id="satisfaction1"
            name="rating_satisfaction"
            value="1"
            required
          />
          <label for="satisfaction1">1</label>

          <input
            type="radio"
            id="satisfaction2"
            name="rating_satisfaction"
            value="2"
          />
          <label for="satisfaction2">2</label>

          <input
            type="radio"
            id="satisfaction3"
            name="rating_satisfaction"
            value="3"
          />
          <label for="satisfaction3">3</label>

          <input
            type="radio"
            id="satisfaction4"
            name="rating_satisfaction"
            value="4"
          />
          <label for="satisfaction4">4</label>

          <input
            type="radio"
            id="satisfaction5"
            name="rating_satisfaction"
            value="5"
          />
          <label for="satisfaction5">5</label>
        </fieldset>

        <fieldset>
          <legend>気分を選択してください</legend>
          <input
            type="radio"
            id="mood1"
            name="rating_mood"
            value="1"
            required
          />
          <label for="mood1">1</label>

          <input type="radio" id="mood2" name="rating_mood" value="2" />
          <label for="mood2">2</label>

          <input type="radio" id="mood3" name="rating_mood" value="3" />
          <label for="mood3">3</label>

          <input type="radio" id="mood4" name="rating_mood" value="4" />
          <label for="mood4">4</label>

          <input type="radio" id="mood5" name="rating_mood" value="5" />
          <label for="mood5">5</label>
        </fieldset>

        <button type="submit">設定</button>
      </form>
    </div>

    <div id="historyPage" class="screen">
      <h1>目標と評価の履歴一覧</h1>

      <table id="historyTable">
        <thead>
          <tr>
            <th>日時</th>
            <th>目標</th>
            <th>評価</th>
          </tr>
        </thead>
        <tbody>
          <!-- JavaScriptでここに行を追加していく -->
          <tr>
            <td>13:45</td>
            <td>本を1章読む</td>
            <td>よくできた</td>
          </tr>
          <tr>
            <td>18:30</td>
            <td>運動30分</td>
            <td>まあまあ</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
